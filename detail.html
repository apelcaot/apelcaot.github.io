<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Program Kerja - OSIS SMA Tarakanita 2 Jakarta</title>
    <!--Favicon-->
     <link rel="icon" type="image/png" href="/downloads/tarakanitalogo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Custom Color Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        taraNavy: {
                            DEFAULT: '#1B365D',
                            50: '#F0F4F9',
                            100: '#DCE4F0',
                            800: '#152B4B',
                            900: '#0F1E35',
                        },
                        taraGold: {
                            DEFAULT: '#D4AF37',
                            hover: '#C09B27',
                            light: '#FFF9E6',
                            accent: '#F2A900'
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar & visual aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #1B365D;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D4AF37;
        }
        .hero-bg {
            background: linear-gradient(135deg, rgba(27, 54, 93, 0.95) 0%, rgba(15, 30, 53, 0.88) 100%), 
                        url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex flex-col min-h-screen selection:bg-taraGold selection:text-taraNavy">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="container mx-auto px-4 lg:px-8 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-taraNavy flex items-center justify-center text-taraGold text-xl font-bold border border-taraGold/40">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span class="text-base sm:text-lg font-bold tracking-tight text-taraNavy">OSIS SMA Tarakanita 2</span>
            </a>
            <a href="/#program" class="text-xs sm:text-sm font-semibold text-taraNavy hover:text-taraGold transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Program Kerja
            </a>
        </div>
    </header>

    <main id="detail-root" class="flex-grow"></main>

    <!-- Footer -->
    <footer class="bg-taraNavy-900 text-slate-400 text-xs py-6 px-4 text-center">
        &copy; 2026 OSIS SMA Tarakanita 2 Jakarta. Hak Cipta Dilindungi.
    </footer>

    <script src="/js/events-data.js"></script>
    <script>
        const statusLabel = {
            'akan-datang': { text: 'Akan Datang', cls: 'bg-taraGold text-taraNavy' },
            'berlangsung': { text: 'Sedang Berlangsung', cls: 'bg-emerald-500 text-white' },
            'selesai': { text: 'Selesai', cls: 'bg-slate-500 text-white' }
        };

        function sectionTitle(icon, text) {
            return `<h2 class="text-xl sm:text-2xl font-extrabold text-taraNavy mb-4 flex items-center gap-3"><span class="w-9 h-9 rounded-xl bg-taraNavy/10 text-taraNavy flex items-center justify-center text-base"><i class="fa-solid ${icon}"></i></span>${text}</h2>`;
        }

        function renderNotFound(root) {
            root.innerHTML = `
                <section class="container mx-auto px-4 py-24 text-center max-w-xl space-y-4">
                    <div class="w-16 h-16 mx-auto rounded-2xl bg-taraNavy/10 text-taraNavy flex items-center justify-center text-2xl"><i class="fa-solid fa-circle-question"></i></div>
                    <h1 class="text-2xl font-extrabold text-taraNavy">Program kerja tidak ditemukan</h1>
                    <p class="text-sm text-slate-500">Halaman yang kamu cari tidak tersedia atau sudah dipindahkan.</p>
                    <a href="/#program" class="inline-block px-6 py-3 rounded-xl bg-taraNavy text-white text-sm font-semibold">Lihat Semua Program Kerja</a>
                </section>`;
        }

        function renderDetail() {
            const root = document.getElementById('detail-root');
            const id = new URLSearchParams(window.location.search).get('id');
            const e = eventsData.find(ev => ev.id === id);
            if (!e) return renderNotFound(root);

            document.title = `${e.title} - OSIS SMA Tarakanita 2 Jakarta`;
            const status = statusLabel[e.cat];
            const reg = e.registration || {};

            const competitionsHtml = e.competitions && e.competitions.length ? `
                <section>
                    ${sectionTitle('fa-medal', 'Cabang Lomba')}
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${e.competitions.map(c => `
                            <div class="bg-white rounded-2xl p-5 border border-slate-200 hover:border-taraGold/60 hover:shadow-md transition-all">
                                <div class="flex items-center gap-3 mb-2">
                                    <div class="w-10 h-10 rounded-xl bg-taraGold/15 text-taraGold flex items-center justify-center"><i class="fa-solid ${c.icon}"></i></div>
                                    <h3 class="font-bold text-taraNavy">${c.name}</h3>
                                </div>
                                <p class="text-xs text-slate-600 leading-relaxed mb-3">${c.desc}</p>
                                <span class="text-[11px] font-semibold text-taraNavy bg-taraNavy/5 px-2.5 py-1 rounded-md"><i class="fa-solid fa-users mr-1"></i>Kuota: ${c.quota}</span>
                            </div>`).join('')}
                    </div>
                </section>` : '';

            const requirementsHtml = e.requirements && e.requirements.length ? `
                <section>
                    ${sectionTitle('fa-clipboard-check', 'Ketentuan Peserta')}
                    <ul class="bg-white rounded-2xl p-6 border border-slate-200 space-y-3">
                        ${e.requirements.map(r => `<li class="flex gap-3 text-sm text-slate-600"><i class="fa-solid fa-circle-check text-taraGold mt-0.5"></i><span>${r}</span></li>`).join('')}
                    </ul>
                </section>` : '';

            const registrationHtml = reg.open ? `
                <div class="bg-taraNavy rounded-3xl p-6 text-white shadow-xl border border-taraGold/30 space-y-4" id="registrasi">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-extrabold">Registrasi</h2>
                        <span class="text-[11px] font-bold bg-emerald-500 px-2.5 py-1 rounded-full">Dibuka</span>
                    </div>
                    <p class="text-xs text-slate-300">Batas pendaftaran: <span class="font-bold text-taraGold">${reg.deadline}</span></p>
                    <ol class="space-y-3">
                        ${reg.steps.map((st, i) => `<li class="flex gap-3 text-xs text-slate-200 leading-relaxed"><span class="w-6 h-6 shrink-0 rounded-full bg-taraGold text-taraNavy font-bold flex items-center justify-center">${i + 1}</span><span>${st}</span></li>`).join('')}
                    </ol>
                    <a href="https://wa.me/6281234567890?text=${encodeURIComponent('Halo OSIS SMA Tarakanita 2, saya ingin mendaftar ' + e.title + '.')}" target="_blank" rel="noopener" class="w-full py-3 rounded-xl bg-taraGold hover:bg-taraGold-hover text-taraNavy font-bold text-sm flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-brands fa-whatsapp"></i> Daftar via WhatsApp Humas
                    </a>
                    <a href="mailto:osis@smatarakanita2.sch.id?subject=${encodeURIComponent('Pendaftaran ' + e.title)}" class="w-full py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white font-semibold text-sm flex items-center justify-center gap-2 border border-white/20 transition-colors">
                        <i class="fa-solid fa-envelope text-taraGold"></i> Kirim Berkas via Email
                    </a>
                </div>` : `
                <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-3" id="registrasi">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-extrabold text-taraNavy">Registrasi</h2>
                        <span class="text-[11px] font-bold bg-slate-200 text-slate-600 px-2.5 py-1 rounded-full">Ditutup</span>
                    </div>
                    <p class="text-sm text-slate-600 leading-relaxed">${reg.note || 'Pendaftaran untuk kegiatan ini sudah ditutup.'}</p>
                    <a href="/#program" class="w-full py-3 rounded-xl bg-taraNavy text-white font-semibold text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-calendar-days text-taraGold"></i> Lihat Program Lainnya
                    </a>
                </div>`;

            root.innerHTML = `
                <!-- Hero -->
                <section class="relative text-white py-16 lg:py-24 px-4 overflow-hidden" style="background: linear-gradient(135deg, rgba(27,54,93,0.95) 0%, rgba(15,30,53,0.85) 100%), url('${e.img}') center/cover no-repeat;">
                    <div class="container mx-auto max-w-5xl space-y-5">
                        <div class="flex flex-wrap items-center gap-3">
                            <span class="text-[11px] font-bold px-3 py-1 rounded-full ${status.cls}">${status.text}</span>
                            <span class="text-xs text-taraGold font-semibold flex items-center gap-1.5"><i class="fa-solid fa-calendar-days"></i> ${e.date}</span>
                        </div>
                        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight flex items-center gap-4">
                            <span class="hidden sm:flex w-14 h-14 rounded-2xl bg-white/10 border border-white/20 text-taraGold items-center justify-center text-2xl"><i class="fa-solid ${e.icon}"></i></span>
                            ${e.title}
                        </h1>
                        <p class="text-slate-300 max-w-3xl leading-relaxed">${e.desc}</p>
                        ${reg.open ? `<a href="#registrasi" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-taraGold hover:bg-taraGold-hover text-taraNavy font-bold shadow-lg transition-colors"><i class="fa-solid fa-pen-to-square"></i> Daftar Sekarang</a>` : ''}
                    </div>
                </section>

                <div class="container mx-auto max-w-5xl px-4 py-12 grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-10">
                        <section>
                            ${sectionTitle('fa-circle-info', 'Tentang Kegiatan')}
                            <div class="space-y-3 text-sm text-slate-600 leading-relaxed">
                                ${e.about.map(p => `<p>${p}</p>`).join('')}
                            </div>
                        </section>

                        <section>
                            ${sectionTitle('fa-bullseye', 'Tujuan')}
                            <ul class="space-y-2">
                                ${e.goals.map(g => `<li class="flex gap-3 text-sm text-slate-600"><i class="fa-solid fa-star text-taraGold mt-0.5 text-xs"></i><span>${g}</span></li>`).join('')}
                            </ul>
                        </section>

                        ${competitionsHtml}

                        <section>
                            ${sectionTitle('fa-timeline', 'Jadwal Kegiatan')}
                            <ol class="relative border-l-2 border-taraGold/40 ml-4 space-y-6">
                                ${e.schedule.map(s => `
                                    <li class="pl-6 relative">
                                        <span class="absolute -left-[9px] top-1 w-4 h-4 rounded-full bg-taraGold border-4 border-slate-50"></span>
                                        <span class="text-xs font-bold text-taraGold">${s.date}</span>
                                        <p class="text-sm text-slate-700 font-medium">${s.activity}</p>
                                    </li>`).join('')}
                            </ol>
                        </section>

                        ${requirementsHtml}
                    </div>

                    <aside class="space-y-6 lg:sticky lg:top-24 self-start">
                        <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4 text-sm">
                            <h2 class="text-lg font-extrabold text-taraNavy">Info Singkat</h2>
                            <div class="flex gap-3"><i class="fa-solid fa-calendar-days text-taraGold mt-1"></i><div><span class="block text-xs text-slate-400">Tanggal</span><span class="font-semibold text-slate-700">${e.date}</span></div></div>
                            <div class="flex gap-3"><i class="fa-solid fa-location-dot text-taraGold mt-1"></i><div><span class="block text-xs text-slate-400">Lokasi</span><span class="font-semibold text-slate-700">${e.location}</span></div></div>
                            <div class="flex gap-3"><i class="fa-solid fa-users text-taraGold mt-1"></i><div><span class="block text-xs text-slate-400">Peserta</span><span class="font-semibold text-slate-700">${e.participants}</span></div></div>
                            <div class="flex gap-3"><i class="fa-solid fa-user-tie text-taraGold mt-1"></i><div><span class="block text-xs text-slate-400">Penanggung Jawab</span><span class="font-semibold text-slate-700">${e.pic}</span></div></div>
                        </div>
                        ${registrationHtml}
                    </aside>
                </div>`;
        }

        renderDetail();
    </script>
</body>
</html>
